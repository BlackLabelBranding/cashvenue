<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#080b12" />
  <meta name="description" content="PourMap shows who is behind the bar, where they are pouring, and what is happening nearby tonight." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="PourMap — See who's pouring near you" />
  <meta property="og:description" content="Discover bartenders, venues, live events, food, and tickets near you tonight." />
  <meta property="og:image" content="/assets/social-card.svg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/assets/pourmap-mark.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/styles.css" />
  <title>PourMap — See who's pouring near you</title>
</head>
<body>
  <noscript><div class="noscript">PourMap requires JavaScript for live map and schedule features.</div></noscript>
  <div id="app">
    <main class="boot-screen">
      <div class="boot-logo">
        <img src="/assets/pourmap-mark.svg" alt="" />
        <strong>POURMAP</strong>
      </div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <p>Finding tonight's pour...</p>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal-root"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
