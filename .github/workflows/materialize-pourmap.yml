name: Materialize PourMap MVP

on:
  push:
    branches: [pourmap-mvp]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: ${{ hashFiles('payload/part-*') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: pourmap-mvp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode validated project archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import glob
          from pathlib import Path

          parts = sorted(glob.glob('payload/part-*'))
          if not parts:
              raise SystemExit('No PourMap payload parts were found.')

          encoded = ''.join(Path(path).read_text(encoding='utf-8') for path in parts)
          encoded = ''.join(encoded.split())
          archive = base64.b64decode(encoded, validate=False)
          Path('/tmp/pourmap-mvp.zip').write_bytes(archive)
          print(f'Decoded {len(parts)} parts into {len(archive):,} bytes.')
          PY
          unzip -t /tmp/pourmap-mvp.zip
          rm -rf /tmp/pourmap-source
          mkdir -p /tmp/pourmap-source
          unzip -q /tmp/pourmap-mvp.zip -d /tmp/pourmap-source

      - name: Replace branch contents with PourMap source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pourmap-source/. .
          find app -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool vercel.json >/dev/null

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Black Label Automation'
          git config user.email 'automation@blacklabel1.com'
          git add -A
          git commit -m 'Build PourMap mobile discovery MVP'
          git push origin HEAD:pourmap-mvp
