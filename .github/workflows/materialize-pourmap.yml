name: Materialize PourMap MVP

on:
  push:
    branches: [pourmap-mvp]
  pull_request:
    branches: [main, pourmap-mvp]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: pourmap-mvp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect materialized source
        id: source
        shell: bash
        run: |
          if compgen -G 'payload/part-*' >/dev/null; then
            echo 'needs_materialization=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_materialization=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Decode validated project archive
        if: steps.source.outputs.needs_materialization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import glob
          import io
          import re
          import zipfile
          from pathlib import Path

          paths = sorted(glob.glob('payload/part-*'))
          if not paths:
              raise SystemExit('No payload parts found.')

          parts = [Path(path).read_bytes() for path in paths]

          def cleaned(data: bytes) -> bytes:
              return re.sub(rb'\s+', b'', data)

          def b64(data: bytes) -> bytes:
              data = cleaned(data)
              data += b'=' * ((4 - len(data) % 4) % 4)
              return base64.b64decode(data, validate=False)

          def variants(seed: bytes):
              seen = set()
              current = seed
              for _ in range(6):
                  if current in seen:
                      break
                  seen.add(current)
                  yield current
                  try:
                      current = b64(current)
                  except Exception:
                      break

          candidates = [b''.join(parts)]
          try:
              candidates.append(b''.join(b64(part) for part in parts))
          except Exception:
              pass

          individually_decoded = []
          for part in parts:
              decoded = part
              for _ in range(4):
                  try:
                      next_value = b64(decoded)
                  except Exception:
                      break
                  if next_value == decoded:
                      break
                  decoded = next_value
                  if decoded.startswith(b'PK\x03\x04'):
                      break
              individually_decoded.append(decoded)
          candidates.append(b''.join(individually_decoded))

          zip_candidates = []
          for candidate_index, candidate in enumerate(candidates):
              for depth, value in enumerate(variants(candidate)):
                  if value.startswith(b'PK\x03\x04'):
                      target = Path(f'/tmp/pourmap-candidate-{candidate_index}-{depth}.zip')
                      target.write_bytes(value)
                      zip_candidates.append(target)
                      print(f'ZIP candidate {target.name}: {len(value):,} bytes; is_zipfile={zipfile.is_zipfile(io.BytesIO(value))}')

          if not zip_candidates:
              prefixes = [part[:32] for part in parts]
              raise SystemExit(f'Unable to decode PourMap archive. Part prefixes: {prefixes!r}')

          # Prefer the largest decoded ZIP candidate. A later repair step validates it.
          selected = max(zip_candidates, key=lambda path: path.stat().st_size)
          Path('/tmp/pourmap-mvp.zip').write_bytes(selected.read_bytes())
          print(f'Selected {selected.name} at {selected.stat().st_size:,} bytes for validation and repair.')
          PY

      - name: Repair and test archive
        if: steps.source.outputs.needs_materialization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if unzip -t /tmp/pourmap-mvp.zip; then
            echo 'Original decoded archive passed validation.'
          else
            echo 'Decoded archive needs repair. Running zip -FF.'
            rm -f /tmp/pourmap-fixed.zip
            zip -FF /tmp/pourmap-mvp.zip --out /tmp/pourmap-fixed.zip
            unzip -t /tmp/pourmap-fixed.zip
            mv /tmp/pourmap-fixed.zip /tmp/pourmap-mvp.zip
          fi
          rm -rf /tmp/pourmap-source
          mkdir -p /tmp/pourmap-source
          unzip -q /tmp/pourmap-mvp.zip -d /tmp/pourmap-source
          echo 'Recovered source files:'
          find /tmp/pourmap-source -maxdepth 3 -type f -printf '%P\n' | sort

      - name: Replace branch contents with PourMap source
        if: steps.source.outputs.needs_materialization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pourmap-source/. .
          test -f index.html
          test -f styles.css
          test -f app/main.js
          find app -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool vercel.json >/dev/null

      - name: Commit complete source tree
        if: steps.source.outputs.needs_materialization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Black Label Automation'
          git config user.email 'automation@blacklabel1.com'
          git add -A
          git commit -m 'Build PourMap mobile discovery MVP'
          git push origin HEAD:pourmap-mvp
