name: Materialize PourMap MVP

on:
  push:
    branches: [pourmap-mvp]
  pull_request:
    branches: [main, pourmap-mvp]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: pourmap-mvp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect materialized source
        id: source
        shell: bash
        run: |
          if compgen -G 'payload/part-*' >/dev/null; then
            echo 'needs_materialization=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needs_materialization=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Decode project archive
        if: steps.source.outputs.needs_materialization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import glob
          import re
          from pathlib import Path

          paths = sorted(glob.glob('payload/part-*'))
          if not paths:
              raise SystemExit('No payload parts found.')

          def decode(data: bytes) -> bytes:
              data = re.sub(rb'\s+', b'', data)
              data += b'=' * ((4 - len(data) % 4) % 4)
              return base64.b64decode(data, validate=False)

          parts = [Path(path).read_bytes() for path in paths]
          candidates = []

          # The archive was stored as separately encoded chunks.
          try:
              candidates.append(b''.join(decode(part) for part in parts))
          except Exception:
              pass

          # Also test the concatenated stream through several decode depths.
          current = b''.join(parts)
          for _ in range(6):
              candidates.append(current)
              try:
                  current = decode(current)
              except Exception:
                  break

          zip_candidates = [value for value in candidates if value.startswith(b'PK\x03\x04')]
          if not zip_candidates:
              raise SystemExit('Unable to locate decoded ZIP data.')

          selected = max(zip_candidates, key=len)
          Path('/tmp/pourmap-mvp.zip').write_bytes(selected)
          print(f'Decoded {len(paths)} parts into {len(selected):,} bytes.')
          PY

      - name: Salvage recoverable files
        if: steps.source.outputs.needs_materialization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/pourmap-fixed.zip
          zip -FF /tmp/pourmap-mvp.zip --out /tmp/pourmap-fixed.zip
          rm -rf /tmp/pourmap-source
          mkdir -p /tmp/pourmap-source
          unzip -o /tmp/pourmap-fixed.zip -d /tmp/pourmap-source || true

          test -f /tmp/pourmap-source/index.html
          test -f /tmp/pourmap-source/styles.css
          test -f /tmp/pourmap-source/app/main.js
          test -f /tmp/pourmap-source/app/map-page.js
          test -f /tmp/pourmap-source/app/config.js

          # These modules were damaged or missing in the uploaded archive.
          # Commit explicit placeholders so they can be rebuilt cleanly next.
          rm -f /tmp/pourmap-source/app/ui.js
          rm -f /tmp/pourmap-source/app/api.js
          rm -f /tmp/pourmap-source/app/public-pages.js
          rm -f /tmp/pourmap-source/app/dashboard-page.js

          cat > /tmp/pourmap-source/app/ui.js <<'EOF'
          // Rebuilt immediately after archive recovery.
          export const appRoot = document.querySelector('#app');
          EOF

          cat > /tmp/pourmap-source/app/api.js <<'EOF'
          // Rebuilt immediately after archive recovery.
          export const apiReady = false;
          EOF

          cat > /tmp/pourmap-source/app/public-pages.js <<'EOF'
          // Rebuilt immediately after archive recovery.
          export function publicPageUnavailable(){ return '<main>PourMap is loading.</main>'; }
          EOF

          cat > /tmp/pourmap-source/app/dashboard-page.js <<'EOF'
          // Rebuilt immediately after archive recovery.
          export async function bootDashboard(){ throw new Error('Dashboard module is being rebuilt.'); }
          EOF

          echo 'Recovered source files:'
          find /tmp/pourmap-source -maxdepth 3 -type f -printf '%P\n' | sort

      - name: Replace branch contents with recovered source
        if: steps.source.outputs.needs_materialization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pourmap-source/. .
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool vercel.json >/dev/null

      - name: Commit recovered source tree
        if: steps.source.outputs.needs_materialization == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Black Label Automation'
          git config user.email 'automation@blacklabel1.com'
          git add -A
          git commit -m 'Recover PourMap source tree for module rebuild'
          git push origin HEAD:pourmap-mvp
