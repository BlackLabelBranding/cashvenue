name: Materialize PourMap MVP

on:
  push:
    branches: [pourmap-mvp]
    paths:
      - payload/part-07
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: pourmap-mvp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode validated project archive
        shell: bash
        run: |
          set -euo pipefail
          cat payload/part-* | base64 --decode > /tmp/pourmap-mvp.zip
          unzip -t /tmp/pourmap-mvp.zip
          mkdir -p /tmp/pourmap-source
          unzip -q /tmp/pourmap-mvp.zip -d /tmp/pourmap-source

      - name: Replace branch contents with PourMap source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pourmap-source/. .
          find app -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool vercel.json >/dev/null

      - name: Commit complete source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Black Label Automation'
          git config user.email 'automation@blacklabel1.com'
          git add -A
          git commit -m 'Build PourMap mobile discovery MVP'
          git push origin HEAD:pourmap-mvp
