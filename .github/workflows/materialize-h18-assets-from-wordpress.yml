name: Bundle Hangar 18 Website Images

on:
  push:
    branches: [h18brewing-site]
    paths:
      - .github/workflows/materialize-h18-assets-from-wordpress.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Hangar 18 branch
        uses: actions/checkout@v4
        with:
          ref: h18brewing-site
          fetch-depth: 0

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install -y webp imagemagick

      - name: Download public source images from the current Hangar 18 site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets /tmp/h18-source

          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://h18brewing.com/wp-content/uploads/2024/09/Logo-18-png.png' \
            --output /tmp/h18-source/logo.png

          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://h18brewing.com/wp-content/uploads/2024/09/hangar-18-outside-scaled-1.jpg' \
            --output /tmp/h18-source/hero.jpg

          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://h18brewing.com/wp-content/uploads/2024/09/hangar-18.jpg' \
            --output /tmp/h18-source/venue.jpg

          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://h18brewing.com/wp-content/uploads/2024/09/meat-hangar-pizza-scaled-1.jpg' \
            --output /tmp/h18-source/pizza.jpg

          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://h18brewing.com/wp-content/uploads/2024/09/Beer-Hangar-scaled-1.jpg' \
            --output /tmp/h18-source/beer.jpg

          curl --fail --location --retry 3 --user-agent 'Mozilla/5.0' \
            'https://h18brewing.com/wp-content/uploads/2024/09/bella.gif' \
            --output /tmp/h18-source/bella.gif

          cp /tmp/h18-source/hero.jpg /tmp/h18-source/josh-holland.jpg

          file /tmp/h18-source/*

      - name: Optimize and package images
        shell: bash
        run: |
          set -euo pipefail

          cwebp -quiet -q 88 -resize 1000 0 /tmp/h18-source/logo.png -o assets/logo.webp
          cwebp -quiet -q 84 -resize 2000 0 /tmp/h18-source/hero.jpg -o assets/hero.webp
          cwebp -quiet -q 84 -resize 1400 0 /tmp/h18-source/venue.jpg -o assets/venue.webp
          cwebp -quiet -q 84 -resize 1200 0 /tmp/h18-source/pizza.jpg -o assets/pizza.webp
          cwebp -quiet -q 84 -resize 1400 0 /tmp/h18-source/beer.jpg -o assets/beer.webp
          gif2webp -quiet -q 82 -resize 1000 0 /tmp/h18-source/bella.gif -o assets/bella.webp || \
            cwebp -quiet -q 82 -resize 1000 0 '/tmp/h18-source/bella.gif[0]' -o assets/bella.webp
          cwebp -quiet -q 82 -resize 1400 0 /tmp/h18-source/josh-holland.jpg -o assets/josh-holland.webp

          convert /tmp/h18-source/logo.png -resize 64x64 -background none -gravity center -extent 64x64 assets/favicon.png
          convert /tmp/h18-source/logo.png -resize 192x192 -background none -gravity center -extent 192x192 assets/icon-192.png
          convert /tmp/h18-source/logo.png -resize 512x512 -background none -gravity center -extent 512x512 assets/icon-512.png

          ls -lh assets
          file assets/*

      - name: Point the website at bundled assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          config = Path('app/config.js')
          text = config.read_text()
          start = text.index('  assets: {')
          end = text.index('  }\n});', start) + len('  }\n});')
          replacement = '''  assets: {
            logo: "/assets/logo.webp",
            hero: "/assets/hero.webp",
            exterior: "/assets/venue.webp",
            pizza: "/assets/pizza.webp",
            interior: "/assets/venue.webp",
            beer: "/assets/beer.webp",
            beerAlt: "/assets/hero.webp",
            bella: "/assets/bella.webp",
            josh: "/assets/josh-holland.webp"
          }
        });'''
          config.write_text(text[:start] + replacement + text[end:])

          for html in [Path('index.html'), *Path('.').glob('*/index.html')]:
              if not html.exists():
                  continue
              value = html.read_text()
              value = value.replace('/assets/logo.png', '/assets/logo.webp')
              value = value.replace('/assets/hero.jpg', '/assets/hero.webp')
              html.write_text(value)
          PY

          cat > manifest.webmanifest <<'JSON'
          {
            "name": "Hangar 18",
            "short_name": "Hangar 18",
            "description": "Craft brews, bold food, live music, events, and tickets in Windsor, Illinois.",
            "start_url": "/",
            "display": "standalone",
            "background_color": "#080808",
            "theme_color": "#b51018",
            "icons": [
              { "src": "/assets/icon-192.png", "sizes": "192x192", "type": "image/png", "purpose": "any maskable" },
              { "src": "/assets/icon-512.png", "sizes": "512x512", "type": "image/png", "purpose": "any maskable" }
            ]
          }
          JSON

      - name: Commit bundled assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets app/config.js index.html manifest.webmanifest
          find . -mindepth 2 -maxdepth 2 -name index.html -print0 | xargs -0 git add
          if git diff --cached --quiet; then
            echo 'No asset changes to commit.'
            exit 0
          fi
          git commit -m 'Bundle Hangar 18 website images locally'
          git push origin HEAD:h18brewing-site
