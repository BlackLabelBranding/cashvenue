name: Temporary PourMap Materializer

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  materialize:
    if: github.head_ref == 'pourmap-mvp'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PourMap branch
        uses: actions/checkout@v4
        with:
          ref: pourmap-mvp
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode and recover PourMap project archive
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import glob
          import io
          import os
          import re
          import struct
          import zipfile
          import zlib
          from pathlib import Path, PurePosixPath

          paths = sorted(glob.glob('payload/part-*'))
          if not paths:
              print('PourMap source is already materialized.')
              Path('/tmp/already-materialized').touch()
              raise SystemExit(0)

          parts = [Path(path).read_bytes() for path in paths]

          def cleaned(data):
              return re.sub(rb'\s+', b'', data)

          def decode64(data):
              data = cleaned(data)
              data += b'=' * ((4 - len(data) % 4) % 4)
              return base64.b64decode(data, validate=False)

          def stages(seed):
              current = seed
              seen = set()
              for _ in range(7):
                  if current in seen:
                      return
                  seen.add(current)
                  yield current
                  try:
                      current = decode64(current)
                  except Exception:
                      return

          candidates = [b''.join(parts)]
          try:
              candidates.append(b''.join(decode64(part) for part in parts))
          except Exception:
              pass

          recursively_decoded = []
          for part in parts:
              current = part
              for _ in range(5):
                  if current.startswith(b'PK\x03\x04'):
                      break
                  try:
                      current = decode64(current)
                  except Exception:
                      break
              recursively_decoded.append(current)
          candidates.append(b''.join(recursively_decoded))

          archive = None
          for candidate in candidates:
              for value in stages(candidate):
                  if value.startswith(b'PK\x03\x04'):
                      archive = value
                      if zipfile.is_zipfile(io.BytesIO(value)):
                          break
              if archive is not None:
                  break

          if archive is None:
              raise SystemExit('Unable to identify the PourMap ZIP payload.')

          Path('/tmp/pourmap-mvp.zip').write_bytes(archive)
          print(f'Decoded {len(paths)} parts into {len(archive):,} bytes.')

          destination = Path('/tmp/pourmap-source')
          if destination.exists():
              import shutil
              shutil.rmtree(destination)
          destination.mkdir(parents=True)

          try:
              with zipfile.ZipFile(io.BytesIO(archive)) as bundle:
                  bundle.extractall(destination)
              print('Extracted with the standard ZIP directory.')
          except Exception as standard_error:
              print(f'Standard ZIP extraction failed: {standard_error}')
              print('Recovering files from sequential local headers.')
              signature = b'PK\x03\x04'
              position = 0
              extracted = 0

              while True:
                  header_at = archive.find(signature, position)
                  if header_at < 0:
                      break
                  if header_at + 30 > len(archive):
                      break

                  fields = struct.unpack_from('<IHHHHHIIIHH', archive, header_at)
                  _, version, flags, method, mtime, mdate, crc, compressed_size, uncompressed_size, name_size, extra_size = fields
                  name_start = header_at + 30
                  data_start = name_start + name_size + extra_size
                  if data_start > len(archive):
                      break

                  raw_name = archive[name_start:name_start + name_size]
                  try:
                      name = raw_name.decode('utf-8' if flags & 0x800 else 'cp437')
                  except Exception:
                      position = header_at + 4
                      continue

                  if flags & 0x08:
                      raise SystemExit(f'Cannot recover streamed ZIP entry: {name}')

                  data_end = data_start + compressed_size
                  if data_end > len(archive):
                      raise SystemExit(f'Truncated ZIP entry: {name}')

                  path = PurePosixPath(name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe ZIP path: {name}')

                  output = destination.joinpath(*path.parts)
                  if name.endswith('/'):
                      output.mkdir(parents=True, exist_ok=True)
                  else:
                      compressed = archive[data_start:data_end]
                      if method == 0:
                          payload = compressed
                      elif method == 8:
                          payload = zlib.decompress(compressed, -15)
                      else:
                          raise SystemExit(f'Unsupported ZIP method {method} for {name}')

                      if uncompressed_size and len(payload) != uncompressed_size:
                          raise SystemExit(f'Bad recovered size for {name}')
                      output.parent.mkdir(parents=True, exist_ok=True)
                      output.write_bytes(payload)
                      extracted += 1
                      print(f'Recovered {name} ({len(payload):,} bytes)')

                  position = data_end

              if extracted == 0:
                  raise SystemExit('No project files could be recovered.')
              print(f'Recovered {extracted} project files.')
          PY

      - name: Replace branch with validated source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/already-materialized ]; then
            exit 0
          fi
          test -f /tmp/pourmap-source/index.html
          test -f /tmp/pourmap-source/app/main.js
          test -f /tmp/pourmap-source/vercel.json
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pourmap-source/. .
          find app -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          python -m json.tool manifest.webmanifest >/dev/null
          python -m json.tool vercel.json >/dev/null

      - name: Commit PourMap source tree
        shell: bash
        run: |
          set -euo pipefail
          if [ -f /tmp/already-materialized ]; then
            exit 0
          fi
          git config user.name 'Black Label Automation'
          git config user.email 'automation@blacklabel1.com'
          git add -A
          git commit -m 'Build PourMap mobile discovery MVP'
          git push origin HEAD:pourmap-mvp
