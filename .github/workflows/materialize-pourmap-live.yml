name: Materialize PourMap Live Source

on:
  push:
    branches: [pourmap-live]
    paths:
      - package/part-05
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: pourmap-live
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Decode and validate project
        shell: bash
        run: |
          set -euo pipefail
          cat package/part-* | tr -d '\n\r ' | base64 --decode > /tmp/pourmap-app.zip
          echo "379338ce9c32b77c63b063a098d5645e4f91b1324d6065d64c01bf0ff41a69cf  /tmp/pourmap-app.zip" | sha256sum --check
          unzip -t /tmp/pourmap-app.zip
          mkdir -p /tmp/pourmap-source
          unzip -q /tmp/pourmap-app.zip -d /tmp/pourmap-source
          node --check /tmp/pourmap-source/app.js
          python -m json.tool /tmp/pourmap-source/manifest.webmanifest >/dev/null
          python -m json.tool /tmp/pourmap-source/vercel.json >/dev/null

      - name: Replace temporary package with source tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/pourmap-source/. .

      - name: Commit complete PourMap source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Black Label Automation'
          git config user.email 'automation@blacklabel1.com'
          git add -A
          git commit -m 'Build PourMap live discovery MVP'
          git push origin HEAD:pourmap-live
